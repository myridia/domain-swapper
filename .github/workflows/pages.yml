name: Deploy static content to Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository_owner == 'myridia'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2   
      - name: install via apt-get
        run: |
            sudo apt-get install wget unzip zip
            
      - name: zip domain-swapper
        run: |
          cd dockers/wordpress/wp-content/plugins/
          zip domain-swapper.zip domain-swapper 
        
       
            
