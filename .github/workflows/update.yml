name: Plugin asset/readme update
on:
  push:
    branches:
    - main
jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Disable initramfs update
        run: sudo sed -i 's/yes/no/g' /etc/initramfs-tools/update-initramfs.conf
      - name: Disable man-db update
        run: sudo rm -f /var/lib/man-db/auto-update
  
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install
        run: |
              sudo apt-get install -y subversion

      - name: Checkout
        run: |
              svn --force checkout https://plugins.svn.wordpress.org/domain-swapper wp

      - name: Copy to trunk
        run: |
          rsync -r --exclude=.svn --exclude=.github ./test/wordpress/wp-content/plugins/domain-swapper/ wp/trunk/
          rsync -r --exclude=.svn --exclude=.github ./test/wordpress/wp-content/plugins/domain-swapper/assets/ wp/
          

      - name: Add anc checkout
        run: |
          cd wp 
          svn add * --force
          svn status

        

